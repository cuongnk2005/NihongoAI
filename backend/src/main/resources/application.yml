spring:
  datasource:
    url: jdbc:sqlite:nihongoai.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    url: jdbc:sqlite:nihongoai.db?foreign_keys=on
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8088
