spring:
  datasource:
    url: jdbc:sqlite:nihongoai.db?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    url: jdbc:sqlite:nihongoai.db?foreign_keys=on
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8088}

ai:
  provider: ${AI_PROVIDER:gemini}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-keys: ${GEMINI_API_KEYS:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  freellmapi:
    base-url: ${FREELLMAPI_BASE_URL:http://localhost:3001/v1}
    api-key: ${FREELLMAPI_API_KEY:}
    model: ${FREELLMAPI_MODEL:gemini-2.0-flash}
